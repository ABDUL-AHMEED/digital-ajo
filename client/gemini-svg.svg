<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d6a4f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b4332;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#52b788;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d8f3dc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded App Tile -->
  <rect width="512" height="512" rx="110" fill="url(#grad)" />
  
  <!-- Shield Outline -->
  <path d="M256 90 L370 140 V240 C370 320 310 390 256 420 C202 390 142 320 142 240 V140 Z" 
        fill="none" stroke="url(#gold)" stroke-width="16" stroke-linejoin="round"/>
        
  <!-- Currency / Contribution Emblem (Naira Symbol Node) -->
  <circle cx="256" cy="245" r="55" fill="url(#gold)" />
  <text x="256" y="270" font-family="Arial, sans-serif" font-size="70" font-weight="900" fill="#1b4332" text-anchor="middle">₦</text>
  
  <!-- Growth Dots -->
  <circle cx="256" cy="140" r="12" fill="#d8f3dc"/>
  <circle cx="340" cy="245" r="10" fill="#d8f3dc"/>
  <circle cx="172" cy="245" r="10" fill="#d8f3dc"/>
</svg>
